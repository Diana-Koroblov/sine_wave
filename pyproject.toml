[project]
name = "sine-waves-project"
version = "1.0.0"
description = "Sine Wave Extraction and Signal De-noising using FC, RNN, and LSTM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "psutil>=7.2.2",
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
# Target version for Python
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Enable specific rules (E: Error, F: Fact, W: Warning, I: Import)
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"
